sdd_kafka_snowflake:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:

    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: SILVER
      # 8 threads, not 4. The bottleneck here is statement count, not volume:
      # 26 models and 185 tests, nearly all short and independent. An X-Small
      # bills for time SPENT UP, not for parallelism -- finishing in half the
      # time with twice the threads is literally half the bill.
      threads: 8
      client_session_keep_alive: false

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT_PROD', env_var('SNOWFLAKE_ACCOUNT')) }}"
      user: "{{ env_var('SNOWFLAKE_USER_PROD', env_var('SNOWFLAKE_USER')) }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE_PROD', 'CDC_ROLE_PROD') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE_PROD', 'CDC_POC_PROD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE_PROD', 'CDC_WH_PROD') }}"
      schema: SILVER
      threads: 8
      client_session_keep_alive: false
