version: 2

# Bronze -- 10 dominios Tier 1 sobre colunas TIPADAS (conector v4 com
# snowflake.enable.schematization=true). As colunas de metadados op,
# source_ts_ms, kafka_offset, kafka_partition e kafka_created_at existem em
# todos os modelos e sao testadas da mesma forma em cada um.
#
# POR QUE OS not_null DE PAYLOAD TEM `where: op IS DISTINCT FROM 'd'`
#
# Um evento de DELETE do Debezium carrega APENAS a chave primaria -- todas as
# colunas de payload chegam nulas. Verificado na tabela raw em 2026-08-10: a
# linha de delete do teste ponta a ponta veio com ORDER_ITEM_ID preenchido e
# PRODUCT_ID nulo.
#
# A Bronze preserva a linha de delete de proposito: ela E o historico CDC, e e
# dela que a Silver decide o que descartar. Logo, um `not_null` sem escopo
# sobre coluna de payload falha assim que um DELETE real e retido -- nao por
# defeito de dado, mas por comportamento correto do protocolo.
#
# Isso nao era teoria: em 2026-08-10 o primeiro `dbt test` do projeto inteiro
# acusou 3 FAIL exatamente assim (bronze_order_items.order_id,
# bronze_orders.user_key e restaurant_key), com 1 linha cada. Dois deles vinham
# de um DELETE anterior a essa sessao; ninguem tinha rodado os testes da Bronze
# desde entao.
#
# O escopo preserva a invariante e a severidade error -- a afirmacao passa a
# ser "linha NAO apagada precisa ter esta coluna". Chave primaria e colunas de
# controle ficam de fora do escopo de proposito: as duas continuam preenchidas
# na linha de delete, entao ali o not_null vale sem ressalva.
#
# ── REVISAO DE SEVERIDADE (2026-08-11) ───────────────────────────────────────
#
# Os 83 testes desta camada foram revisados um a um contra a Decision 3 do
# DESIGN_GOVERNANCA_QUALIDADE_DADOS, ratificada na mesma data. Ate entao eles
# eram o unico bloco do projeto que nunca tinha passado pelo criterio: estavam
# em `error` por omissao do default, nao por analise.
#
# CRITERIO: `error` quando a violacao corrompe dado ou deixa estado
# inconsistente sem recuperacao segura -- na pratica, quando a violacao
# propagada tornaria uma metrica de negocio objetivamente errada. `warn`
# quando o dado esta degradado mas o sistema continua previsivel.
#
# RESULTADO: os 83 continuam em `error`, e NENHUMA severidade mudou. Isso nao
# e preguica de revisao -- e o que sai de olhar para que serve cada coluna:
#
#   chave (event_id, order_id, uuid, ...)  -> e o unique_key do MERGE da Bronze
#       e o PARTITION BY do resolve_cdc. Duplicada ou nula, a deduplicacao
#       escolhe linha errada e a Silver inteira sai torta.
#
#   op                                     -> alimenta `op IS DISTINCT FROM 'd'`.
#       Nulo ou com valor novo, um DELETE passa a valer como dado vivo.
#
#   source_ts_ms, kafka_offset             -> sao o ORDER BY da deduplicacao.
#       Nulos, o desempate volta a ser nao deterministico -- exatamente o bug
#       que a mudanca 1 do resolve_cdc corrigiu.
#
#   kafka_created_at                       -> e o watermark incremental de
#       TODOS os 10 models desta camada (`MAX(kafka_created_at)` no filtro do
#       is_incremental). Nulo, a deteccao de lote novo para de funcionar.
#       Era o candidato obvio a `warn` por parecer metadado de observabilidade;
#       e das colunas mais estruturais que existem aqui.
#
#   payload com escopo de delete           -> payment_id, user_key,
#       restaurant_key, cpf, cnpj, event_name, event_type e os timestamps sao
#       chave de juncao ou de agrupamento na Gold. Nulos, a linha some de uma
#       agregacao em silencio, e metrica com linha faltando e metrica errada,
#       nao metrica degradada.
#
# OBSERVACAO SEM ACAO: `event_timestamp` e derivado de `event_timestamp_ms` por
# CAST no mesmo SELECT, entao o not_null dele so falha se o do ms falhar antes.
# E redundante, nao incorreto -- fica registrado, sem remocao, porque redundancia
# barata em teste de landing nao vale o risco de tirar a rede errada.

models:
  - name: bronze_payment_events
    description: >
      Eventos do ciclo de vida do pagamento, um por transicao. Campo `event` chega como VARCHAR (JSONB serializado pelo Debezium) e e expandido em event_name + timestamp normalizado.
    columns:
      - name: event_id
        description: "Identificador unico do evento (UUID)."
        tests: [unique, not_null]

      - name: payment_id
        description: "Pagamento a que o evento pertence. Varios eventos compartilham o mesmo payment_id."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: event_name
        description: "Nome do evento no ciclo: created, authorized, captured, succeeded, settled, closed, refunded."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: event_timestamp_ms
        description: "Timestamp do evento em epoch ms. Origem manda int ou float cientifico; CAST via FLOAT cobre os dois."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: event_timestamp
        description: "event_timestamp_ms convertido para TIMESTAMP_NTZ."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: dt_current_timestamp
        description: "Timestamp de processamento da origem. Auditoria apenas."

      - name: op
        description: "Operacao CDC do Debezium (c=insert, u=update, d=delete, r=snapshot)."
        tests:
          - not_null
          - accepted_values:
              values: ['c', 'u', 'd', 'r']

      - name: source_ts_ms
        description: "Epoch ms do commit no Postgres (source.ts_ms do Debezium)."
        tests: [not_null]

      - name: kafka_offset
        description: "Offset da mensagem no topico. Desempate na deduplicacao."
        tests: [not_null]

      - name: kafka_partition
        description: "Particao Kafka de origem."

      - name: kafka_created_at
        description: >
          RECORD_METADATA:CreateTime (epoch ms). Watermark do modo
          incremental -- so entram linhas acima do MAX ja materializado.
        tests: [not_null]
  - name: bronze_orders
    description: >
      Tabela hub do modelo. Liga os demais dominios por chaves de negocio heterogeneas: CPF, CNPJ, driver_id e UUIDs.
