      - name: restaurant_id
        description: "Numeric restaurant ID."

      - name: product_name
        description: "Product name at the time of the order."

      - name: product_type
        description: "Product type."

      - name: cuisine_type
        description: "Cuisine type."

      - name: unit_price
        description: "Unit price."

      - name: quantity
        description: "Quantity."

      - name: subtotal
        description: "Line subtotal."

