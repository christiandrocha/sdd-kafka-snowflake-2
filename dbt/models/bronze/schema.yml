version: 2

# Bronze -- 10 Tier 1 domains over TYPED columns (v4 connector with
# snowflake.enable.schematization=true). The metadata columns op,
# source_ts_ms, kafka_offset, kafka_partition and kafka_created_at exist in
# every model and are tested the same way in each one.
#
# WHY THE PAYLOAD not_null TESTS CARRY `where: op IS DISTINCT FROM 'd'`
#
# A Debezium DELETE event carries ONLY the primary key -- every payload column
# arrives null. Verified on the raw table on 2026-08-10: the delete row from
# the end-to-end test came with ORDER_ITEM_ID populated and PRODUCT_ID null.
#
# Bronze preserves the delete row on purpose: it IS the CDC history, and it is
# what Silver reads to decide what to discard. So an unscoped `not_null` on a
# payload column fails the moment a real DELETE is retained -- not because the
# data is defective, but because the protocol is behaving correctly.
#
# This was not theory: on 2026-08-10 the project's first `dbt test` reported 3
# FAILs exactly like this (bronze_order_items.order_id, bronze_orders.user_key
# and restaurant_key), with 1 row each. Two of them came from a DELETE that
# predated that session; nobody had run the Bronze tests since.
#
# The scope preserves the invariant and the error severity -- the assertion
# becomes "a row that has NOT been deleted must have this column". The primary
# key and the control columns are left out of the scope on purpose: both stay
# populated on the delete row, so there not_null holds without qualification.
#
# ── SEVERITY REVIEW (2026-08-11) ─────────────────────────────────────────────
#
# The 83 tests of this layer were reviewed one by one against Decision 3 of
# DESIGN_GOVERNANCA_QUALIDADE_DADOS, ratified the same day. Until then they
# were the only block in the project that had never been through the criterion:
# they sat at `error` by default omission, not by analysis.
#
# CRITERION: `error` when the violation corrupts data or leaves inconsistent
# state with no safe recovery -- in practice, when the violation, propagated,
# would make a business metric objectively wrong. `warn` when the data is
# degraded but the system stays predictable.
#
# RESULT: all 83 remain at `error`, and NO severity changed. That is not
# laziness in the review -- it is what comes out of looking at what each column
# is for:
#
#   key (event_id, order_id, uuid, ...)    -> it is the unique_key of Bronze's
#       MERGE and the PARTITION BY of resolve_cdc. Duplicated or null, the
#       deduplication picks the wrong row and all of Silver comes out crooked.
#
#   op                                     -> feeds `op IS DISTINCT FROM 'd'`.
#       Null or carrying a new value, a DELETE starts counting as live data.
#
#   source_ts_ms, kafka_offset             -> they are the ORDER BY of the
#       deduplication. Null, the tie-break goes back to being
#       non-deterministic -- exactly the bug that change 1 of resolve_cdc fixed.
#
#   kafka_created_at                       -> it is the incremental watermark of
#       ALL 10 models in this layer (`MAX(kafka_created_at)` in the
#       is_incremental filter). Null, new-batch detection stops working.
#       It was the obvious candidate for `warn` because it looks like
#       observability metadata; it is among the most structural columns here.
#
#   payload with delete scope              -> payment_id, user_key,
#       restaurant_key, cpf, cnpj, event_name, event_type and the timestamps
#       are join or grouping keys in Gold. Null, the row vanishes from an
#       aggregation silently, and a metric with a missing row is a wrong
#       metric, not a degraded one.
#
# OBSERVATION WITHOUT ACTION: `event_timestamp` is derived from
# `event_timestamp_ms` by a CAST in the same SELECT, so its not_null can only
# fail if the ms one fails first. It is redundant, not incorrect -- recorded
# here without removal, because cheap redundancy in a landing test is not worth
# the risk of pulling out the wrong net.

models:
  - name: bronze_payment_events
    description: >
      Payment lifecycle events, one per transition. The `event` field arrives as VARCHAR (JSONB serialized by Debezium) and is expanded into event_name + a normalized timestamp.
    columns:
      - name: event_id
        description: "Unique event identifier (UUID)."
        tests: [unique, not_null]

      - name: payment_id
        description: "Payment the event belongs to. Several events share the same payment_id."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: event_name
        description: "Event name in the lifecycle: created, authorized, captured, succeeded, settled, closed, refunded."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: event_timestamp_ms
        description: "Event timestamp in epoch ms. The source sends an int or a scientific float; the CAST through FLOAT covers both."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: event_timestamp
        description: "event_timestamp_ms converted to TIMESTAMP_NTZ."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: dt_current_timestamp
        description: "Source processing timestamp. Audit only."

      - name: op
        description: "Debezium CDC operation (c=insert, u=update, d=delete, r=snapshot)."
        tests:
          - not_null
          - accepted_values:
              values: ['c', 'u', 'd', 'r']

      - name: source_ts_ms
        description: "Epoch ms of the Postgres commit (Debezium's source.ts_ms)."
        tests: [not_null]

      - name: kafka_offset
        description: "Message offset in the topic. Tie-break in deduplication."
        tests: [not_null]

      - name: kafka_partition
        description: "Source Kafka partition."

      - name: kafka_created_at
        description: >
          RECORD_METADATA:CreateTime (epoch ms). Watermark of the
          incremental mode -- only rows above the already-materialized MAX enter.
        tests: [not_null]
  - name: bronze_orders
    description: >
      The model's hub table. Links the other domains through heterogeneous business keys: CPF, CNPJ, driver_id and UUIDs.
    columns:
      - name: order_id
        description: "Order identifier (UUID)."
        tests: [unique, not_null]

      - name: order_date
        description: "Order date and time."

      - name: total_amount
        description: "Order total amount."

      - name: user_key
        description: "User CPF. Joins users_mongo.cpf / users_mssql.cpf."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: restaurant_key
        description: "Restaurant CNPJ. Joins restaurants.cnpj."
        tests:
          - not_null:
              config:
                where: "op IS DISTINCT FROM 'd'"

      - name: driver_key
        description: "Driver's driver_id. Joins drivers.driver_id."

      - name: payment_key
        description: "Payment UUID."

      - name: rating_key
        description: "Rating UUID. Tier 2 domain removed -- orphan column, kept for fidelity to the source."

      - name: dt_current_timestamp
        description: "Source processing timestamp."

      - name: op
        description: "Debezium CDC operation (c=insert, u=update, d=delete, r=snapshot)."
        tests:
          - not_null
          - accepted_values:
              values: ['c', 'u', 'd', 'r']

      - name: source_ts_ms
        description: "Epoch ms of the Postgres commit (Debezium's source.ts_ms)."
        tests: [not_null]

      - name: kafka_offset
        description: "Message offset in the topic. Tie-break in deduplication."
        tests: [not_null]

      - name: kafka_partition
        description: "Source Kafka partition."

      - name: kafka_created_at
        description: >
          RECORD_METADATA:CreateTime (epoch ms). Watermark of the
          incremental mode -- only rows above the already-materialized MAX enter.
        tests: [not_null]
  - name: bronze_order_items
    description: >
      Order line items -- largest volume in the project. A single connector serves this domain since v4 (the client-side buffer that motivated a separate connector no longer exists).
    columns:
      - name: order_item_id
        description: "Item identifier (UUID)."
        tests: [unique, not_null]

      - name: order_id
        description: "Order the item belongs to. Joins bronze_orders.order_id."
